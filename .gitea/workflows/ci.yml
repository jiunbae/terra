name: CI

# Gitea mirrors GitHub, so only push events arrive here — a mirrored pull
# request has no PR object on this side. Building every branch is what lets the
# report job put a status back on the GitHub PR: the mirrored head commit is the
# same SHA the PR points at.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test backend
        run: uv run python -m unittest discover -s tests -v
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run browser E2E tests
        run: npm run test:e2e
        working-directory: frontend

  # Puts the Gitea result back on the GitHub commit so pull requests still show
  # a check. Without GH_STATUS_TOKEN the job is a no-op rather than a failure,
  # so CI stays usable before the token is provisioned.
  report:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()
    steps:
      - name: Report status to GitHub
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          STATE: ${{ (needs.test.result == 'success' && needs.e2e.result == 'success') && 'success' || 'failure' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          if [ -z "$GH_STATUS_TOKEN" ]; then
            echo "GH_STATUS_TOKEN is not set — skipping the GitHub status report."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"gitea/ci\",\"target_url\":\"$TARGET_URL\",\"description\":\"Gitea Actions\"}" \
            >/dev/null
          echo "Reported $STATE to GitHub."
